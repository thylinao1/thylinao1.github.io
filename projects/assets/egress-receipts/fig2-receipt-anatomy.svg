<text x="316" y="490.875" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="18" font-weight="700" font-style="normal" fill="#0b0b0b" text-anchor="start"><tspan x="316" dy="0">One signed, anchored receipt</tspan></text><text x="316" y="524.175" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" font-style="italic" fill="#898781" text-anchor="start"><tspan x="316" dy="0">https://shadow-commit/egress-receipt/v0.3</tspan></text><text x="316" y="548.025" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" font-style="normal" fill="#52514e" text-anchor="start"><tspan x="316" dy="0">runId, policyAllowlist, 3× imageDigest</tspan></text><text x="316" y="572.55" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" font-style="normal" fill="#52514e" text-anchor="start"><tspan x="316" dy="0">enforcementLogMerkleRoot, witnessMerkleRoot, canaryHitsRoot, treeSizes</tspan></text><text x="316" y="597.0749999999999" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" font-style="normal" fill="#52514e" text-anchor="start"><tspan x="316" dy="0">externalAnchor { type, commits: &quot;witnessMerkleRoot&quot;, submission, receipt }</tspan></text><text x="316" y="621.5999999999999" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" font-style="normal" fill="#52514e" text-anchor="start"><tspan x="316" dy="0">producedAt, receiptVersion &quot;0.3&quot;</tspan></text><text x="316" y="646.1249999999999" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" font-style="normal" fill="#0b0b0b" text-anchor="start"><tspan x="316" dy="0">externalAnchor.commits == witnessMerkleRoot, submitted DURING the run (git-note / Rekor / OTS) -</tspan><tspan x="316" dy="15.525">a post-hoc host compromise cannot rewrite an already-anchored head.</tspan></text><text x="316" y="686.1749999999998" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="400" font-style="normal" fill="#0b0b0b" text-anchor="start"><tspan x="316" dy="0">DSSE envelope, Ed25519 over the PAE, verified against journal.pub - an out-of-band trust root,</tspan><tspan x="316" dy="15.525">never a key carried inside the receipt itself.</tspan></text><text x="316" y="726.2249999999998" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9.5" font-weight="400" font-style="italic" fill="#898781" text-anchor="start"><tspan x="316" dy="0">repo/CONTRACT.md §1a - §1c</tspan></text>
