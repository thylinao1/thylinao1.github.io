<rect x="978" y="130.875" width="344" height="26" rx="13" fill="#1baf7a1a" stroke="none" stroke-width="1"/><text x="1150" y="147.875" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#1baf7a" text-anchor="middle"><tspan x="1150" dy="0">What did it reach for?</tspan></text>
<text x="978" y="180.875" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#0b0b0b" text-anchor="start"><tspan x="978" dy="0">Decoy tripwires</tspan></text><text x="978" y="209.8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" font-style="normal" fill="#52514e" text-anchor="start"><tspan x="978" dy="0">an allowlisted honey-endpoint + a honey-credential;</tspan><tspan x="978" dy="14.850000000000001">fires on egress, never on a read</tspan></text><text x="978" y="247.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" font-style="normal" fill="#1baf7a" text-anchor="start"><tspan x="978" dy="0">produces canaryHitsRoot</tspan></text><text x="978" y="270.35" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="400" font-style="normal" fill="#52514e" text-anchor="start"><tspan x="978" dy="0">Each hit binds to a real witnessed flow leaf. A benign</tspan><tspan x="978" dy="14.175">run touches no decoy → EMPTY_ROOT, and reconciliation</tspan><tspan x="978" dy="14.175">still holds zero OMITTED.</tspan></text>
<text x="978" y="354.875" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" font-weight="400" font-style="italic" fill="#898781" text-anchor="start"><tspan x="978" dy="0">repo/CONTRACT.md §5; research/sprint/decoy-results.md</tspan></text>
