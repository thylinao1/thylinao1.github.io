<text x="500" y="161.45" font-size="17" font-weight="700" font-style="normal" fill="#0b0b0b" text-anchor="middle"><tspan x="500" dy="0">What actually crossed the</tspan><tspan x="500" dy="22.95">wire?</tspan></text>
<text x="372.67" y="211.9" font-size="19" font-weight="700" font-style="normal" fill="#0b0b0b" text-anchor="start"><tspan x="372.67" dy="0">Independent egress</tspan><tspan x="372.67" dy="25.65">witness</tspan></text>
<text x="372.67" y="271.2" font-size="16" font-weight="400" font-style="normal" fill="#52514e" text-anchor="start"><tspan x="372.67" dy="0">produces</tspan></text>
<text x="372.67" y="300.8" font-size="17" font-weight="700" font-style="normal" fill="#0b0b0b" text-anchor="start"><tspan x="372.67" dy="0">witnessMerkleRoot</tspan></text>
<rect x="669.33" y="104" width="290.67" height="240.2" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<rect x="669.33" y="104" width="290.67" height="6" rx="0" fill="#1baf7a" stroke="none" stroke-width="1"/>
<rect x="687.33" y="126" width="254.67" height="59.9" rx="29.950000000000003" fill="#1baf7a1f" stroke="none" stroke-width="1"/>
<text x="814.67" y="161.45" font-size="17" font-weight="700" font-style="normal" fill="#0b0b0b" text-anchor="middle"><tspan x="814.67" dy="0">What did it reach for?</tspan></text>
<text x="687.33" y="211.9" font-size="19" font-weight="700" font-style="normal" fill="#0b0b0b" text-anchor="start"><tspan x="687.33" dy="0">Decoy tripwires</tspan></text>
