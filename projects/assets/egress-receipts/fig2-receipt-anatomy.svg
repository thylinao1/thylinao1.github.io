<text x="78" y="180.875" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#0b0b0b" text-anchor="start"><tspan x="78" dy="0">Enforcement log</tspan></text><text x="78" y="209.8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" font-style="normal" fill="#52514e" text-anchor="start"><tspan x="78" dy="0">the broker&apos;s own decision log (egress.jsonl: LIVE /</tspan><tspan x="78" dy="14.850000000000001">ALLOW / HELD / DENY)</tspan></text><text x="78" y="247.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" font-style="normal" fill="#2a78d6" text-anchor="start"><tspan x="78" dy="0">produces enforcementLogMerkleRoot</tspan></text><text x="78" y="270.35" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="400" font-style="normal" fill="#52514e" text-anchor="start"><tspan x="78" dy="0">Whole-row leaves, canonicalised, file order. Carries</tspan><tspan x="78" dy="14.175">resolvedIp - the peer IP the broker actually opened -</tspan><tspan x="78" dy="14.175">which is what closes the real-CDN false-alarm gap.</tspan></text>
<text x="78" y="354.875" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" font-weight="400" font-style="italic" fill="#898781" text-anchor="start"><tspan x="78" dy="0">repo/CONTRACT.md §3; apps/server/broker/server.mjs</tspan></text>
<rect x="510" y="112.875" width="380" height="272" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
