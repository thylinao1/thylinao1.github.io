<rect x="528" y="130.875" width="344" height="26" rx="13" fill="#eb68341a" stroke="none" stroke-width="1"/><text x="700" y="147.875" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" font-style="normal" fill="#eb6834" text-anchor="middle"><tspan x="700" dy="0">What actually crossed the wire?</tspan></text>
<text x="528" y="180.875" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15.5" font-weight="700" font-style="normal" fill="#0b0b0b" text-anchor="start"><tspan x="528" dy="0">Independent egress witness</tspan></text><text x="528" y="209.8" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="400" font-style="normal" fill="#52514e" text-anchor="start"><tspan x="528" dy="0">VM-conntrack, its own container / uid / netns /</tspan><tspan x="528" dy="14.850000000000001">signing key</tspan></text><text x="528" y="247.5" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="700" font-style="normal" fill="#eb6834" text-anchor="start"><tspan x="528" dy="0">produces witnessMerkleRoot</tspan></text><text x="528" y="270.35" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="10.5" font-weight="400" font-style="normal" fill="#52514e" text-anchor="start"><tspan x="528" dy="0">Canonical flow tuples incl. runId, in a sink the</tspan><tspan x="528" dy="14.175">sandbox uid cannot write. Root anchored OUTSIDE the</tspan><tspan x="528" dy="14.175">sandbox during the run, not after.</tspan></text>
<text x="528" y="354.875" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="9" font-weight="400" font-style="italic" fill="#898781" text-anchor="start"><tspan x="528" dy="0">repo/CONTRACT.md §2, §6; attest/witness/SKELETON-RUN.md</tspan><tspan x="528" dy="12.15">(commit 3524a37)</tspan></text>
