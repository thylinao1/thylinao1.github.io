<line x1="814.67" y1="347.2" x2="650" y2="371.2" stroke="#1baf7a" stroke-width="2" stroke-linecap="round"/><path d="M 650 371.2 L 655.8028166399102 367.28498798934396 M 650 371.2 L 656.6788766412116 373.29585467327263" stroke="#1baf7a" stroke-width="2" stroke-linecap="round" fill="none"/>
<text x="86" y="415.2" font-size="21" font-weight="700" font-style="normal" fill="#0b0b0b" text-anchor="start"><tspan x="86" dy="0">One signed, anchored receipt</tspan></text>
<text x="86" y="449.55" font-size="16" font-weight="400" font-style="italic" fill="#52514e" text-anchor="start"><tspan x="86" dy="0">https://shadow-commit/egress-receipt/v0.3</tspan></text>
<text x="86" y="477.15" font-size="16" font-weight="400" font-style="normal" fill="#52514e" text-anchor="start"><tspan x="86" dy="0">runId, policyAllowlist, 3× imageDigest</tspan></text>
<text x="86" y="504.75" font-size="16" font-weight="400" font-style="normal" fill="#52514e" text-anchor="start"><tspan x="86" dy="0">enforcementLogMerkleRoot, witnessMerkleRoot, canaryHitsRoot, treeSizes</tspan></text>
<text x="86" y="532.35" font-size="16" font-weight="400" font-style="normal" fill="#52514e" text-anchor="start"><tspan x="86" dy="0">externalAnchor { type, commits: &quot;witnessMerkleRoot&quot;, submission, receipt }</tspan></text>
<text x="86" y="559.95" font-size="16" font-weight="400" font-style="normal" fill="#52514e" text-anchor="start"><tspan x="86" dy="0">producedAt, receiptVersion &quot;0.3&quot;</tspan></text>
<text x="86" y="587.55" font-size="16" font-weight="400" font-style="normal" fill="#0b0b0b" text-anchor="start"><tspan x="86" dy="0">externalAnchor.commits == witnessMerkleRoot, submitted DURING the run (git-note / Rekor / OTS) - a</tspan><tspan x="86" dy="21.6">post-hoc host compromise cannot rewrite an already-anchored head.</tspan></text>
<text x="86" y="636.75" font-size="16" font-weight="400" font-style="normal" fill="#0b0b0b" text-anchor="start"><tspan x="86" dy="0">DSSE envelope, Ed25519 over the PAE, verified against journal.pub - an out-of-band trust root, never a</tspan><tspan x="86" dy="21.6">key carried inside the receipt itself.</tspan></text>
<rect x="40" y="712.95" width="920" height="130.85" rx="10" fill="#fcfcfb" stroke="#e1e0d9" stroke-width="1"/>
<line x1="500" y1="685.95" x2="500" y2="709.95" stroke="#52514e" stroke-width="2" stroke-linecap="round"/><path d="M 500 709.95 L 496.96281382617707 703.6432179246831 M 500 709.95 L 503.03718617382293 703.6432179246831" stroke="#52514e" stroke-width="2" stroke-linecap="round" fill="none"/>
<text x="66" y="749.95" font-size="19" font-weight="700" font-style="normal" fill="#008300" text-anchor="start"><tspan x="66" dy="0">Any third party verifies this offline - no network, no lab access</tspan></text>
<text x="66" y="785.6" font-size="16" font-weight="400" font-style="normal" fill="#0b0b0b" text-anchor="start"><tspan x="66" dy="0">./verify receipt-clean.json # exit 0 - reconciles, 0 omitted</tspan></text>
<text x="66" y="817.2" font-size="16" font-weight="400" font-style="normal" fill="#0b0b0b" text-anchor="start"><tspan x="66" dy="0">./verify receipt-tampered.json # exit 1 - names the hidden flow</tspan></text>
