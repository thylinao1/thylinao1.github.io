<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="787" viewBox="0 0 1000 787" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>The sandbox&apos;s own egress: fully witnessed</title>
  <desc>The sandbox&apos;s own broker-mediated egress is fully witnessed: every in-scope technique-hop is witnessed or correctly denied (4 of 4). The dns-pinned pivot - where the allowlist&apos;s hostname check was fooled but the witness still recorded the real, pivoted destination - is the positive finding here. The two techniques outside that count are named, not hidden: a compromised relay&apos;s own onward egress from a different host, and a deliberately built observer-bypass demonstrating this design&apos;s honest limit. Numbers: attest/replay/RESULTS.md §a; framing rationale: research/sprint/COMPLETENESS-FRAMING.md.</desc>
