<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="789" viewBox="0 0 1000 789" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title>The decoy: zero false alarms, one exfil caught, tamper survives</title>
  <desc>Fires on egress, never on a read (repo/CONTRACT.md §5). Numbers transcribed from research/sprint/WS-E-OUT.md once WS-E landed it; this script regenerates only from the committed JSON beside it, so every number below is a real measured run, not a placeholder, and reproducing the figure needs no access to that external coordination file.</desc>
  <rect x="0" y="0" width="1000" height="789" fill="#fcfcfb"/>
<text x="40" y="46" font-size="26" font-weight="700" font-style="normal" fill="#0b0b0b" text-anchor="start"><tspan x="40" dy="0">The decoy: zero false alarms, one exfil caught, tamper survives</tspan></text>
<rect x="40" y="80" width="444" height="448.3" rx="10" fill="#f9f9f7" stroke="#e1e0d9" stroke-width="1"/>
<rect x="40" y="80" width="6" height="448.3" rx="0" fill="#008300" stroke="none" stroke-width="1"/>
<text x="64" y="128" font-size="25" font-weight="700" font-style="normal" fill="#0b0b0b" text-anchor="start"><tspan x="64" dy="0">0 hits / 40 witnessed flows</tspan></text>
<text x="64" y="173.75" font-size="16" font-weight="400" font-style="normal" fill="#52514e" text-anchor="start"><tspan x="64" dy="0">False-positive floor across every real benign</tspan><tspan x="64" dy="21.6">turn measured</tspan></text>
<text x="64" y="228.95" font-size="16" font-weight="400" font-style="normal" fill="#0b0b0b" text-anchor="start"><tspan x="64" dy="0">• WS-E fp-floor.mts, 5 reps: 0/5 turns</tspan><tspan x="64" dy="21.6">decoy-egress, 0/5 turns decoy-secret-exfil (19</tspan><tspan x="64" dy="21.6">real witnessed flows: real pip install, real HF</tspan><tspan x="64" dy="21.6">config.json pull, DNS churn)</tspan></text>
<text x="64" y="327.35" font-size="16" font-weight="400" font-style="normal" fill="#0b0b0b" text-anchor="start"><tspan x="64" dy="0">• Corroboration: the SAME detector re-run over</tspan><tspan x="64" dy="21.6">WS-C&apos;s 6 prior benign bundles (21 flows) → 0 hits</tspan></text>
<text x="64" y="382.55" font-size="16" font-weight="400" font-style="normal" fill="#0b0b0b" text-anchor="start"><tspan x="64" dy="0">• Total: 0 hits over 11 real benign turns / 40</tspan><tspan x="64" dy="21.6">witnessed flows</tspan></text>
<rect x="516" y="80" width="444" height="448.3" rx="10" fill="#f9f9f7" stroke="#e1e0d9" stroke-width="1"/>
<rect x="516" y="80" width="6" height="448.3" rx="0" fill="#2a78d6" stroke="none" stroke-width="1"/>
<text x="540" y="128" font-size="25" font-weight="700" font-style="normal" fill="#0b0b0b" text-anchor="start"><tspan x="540" dy="0">689 ms median, n = 5</tspan><tspan x="540" dy="33.75">(638-785)</tspan></text>
<text x="540" y="207.5" font-size="16" font-weight="400" font-style="normal" fill="#52514e" text-anchor="start"><tspan x="540" dy="0">Exfil → canary-hit provable in the anchored</tspan><tspan x="540" dy="21.6">receipt</tspan></text>
<text x="540" y="262.7" font-size="16" font-weight="400" font-style="normal" fill="#0b0b0b" text-anchor="start"><tspan x="540" dy="0">about 1.96 s end to end including a fixed,</tspan><tspan x="540" dy="21.6">tunable 1200 ms conntrack-settle wait; offline</tspan><tspan x="540" dy="21.6">verify (the judge&apos;s step) 172 ms median</tspan></text>
<text x="540" y="339.5" font-size="16" font-weight="400" font-style="normal" fill="#52514e" text-anchor="start"><tspan x="540" dy="0">Per-step medians: freeze 506, anchor 76, detect</tspan><tspan x="540" dy="21.6">0, build/sign 12, untimed glue 63 ms (medians do</tspan><tspan x="540" dy="21.6">not add to the median total).</tspan></text>
<text x="540" y="416.3" font-size="16" font-weight="400" font-style="normal" fill="#52514e" text-anchor="start"><tspan x="540" dy="0">5 timed runs on 2026-09-13, one host clock;</tspan><tspan x="540" dy="21.6">corroborated by all 12 red-team runs on disk</tspan><tspan x="540" dy="21.6">(median 674.5 ms). CANARY-HIT fired and survived</tspan><tspan x="540" dy="21.6">the tamper in 5 of 5. The earlier single-run 657</tspan><tspan x="540" dy="21.6">ms and its 608 ms step sum are superseded.</tspan></text>
<text x="40" y="582.3" font-size="19" font-weight="700" font-style="normal" fill="#0b0b0b" text-anchor="start"><tspan x="40" dy="0">The red-team turn: caught, survives tamper, forgery still fails</tspan></text>
